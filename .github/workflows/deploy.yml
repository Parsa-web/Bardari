name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npx vite build
      # تصاویر هفتگی جنین (1.jfif تا 40.jfif در ریشه مخزن) به dist/weeks/<week>.jpg کپی می‌شوند.
      # در صورت وجود ImageMagick فشرده و کوچک می‌شوند تا سایت سریع بماند.
      - name: Prepare weekly baby images
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          mkdir -p dist/weeks
          count=0
          for f in ./*.jfif ./*.jpg ./*.jpeg ./*.png ./*.webp; do
            base="$(basename "$f")"
            name="${base%.*}"
            case "$name" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$name" -lt 1 ] || [ "$name" -gt 40 ]; then continue; fi
            if command -v convert >/dev/null 2>&1; then
              convert "$f" -auto-orient -resize '900x900>' -quality 80 "dist/weeks/$name.jpg" || cp "$f" "dist/weeks/$name.jpg"
            else
              cp "$f" "dist/weeks/$name.jpg"
            fi
            count=$((count+1))
          done
          echo "copied $count weekly images"
          ls -la dist/weeks | head -n 20
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
